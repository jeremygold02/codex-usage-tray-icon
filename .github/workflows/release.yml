name: Build Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current main head
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch main." }
          $mainSha = [string](git rev-parse origin/main)
          if (-not [string]::Equals($mainSha.Trim(), $env:GITHUB_SHA, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Release SHA $env:GITHUB_SHA is not the current main head $($mainSha.Trim())."
          }

      - name: Check for an existing release at this commit
        id: release_guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $existingTag = ""
          $tags = @(git tag --list | Where-Object { $_ -match '^v?\d+\.\d+\.\d+$' })
          foreach ($tag in $tags) {
            $tagSha = [string](git rev-list -n 1 $tag)
            if (-not [string]::Equals($tagSha.Trim(), $env:RELEASE_SHA, [System.StringComparison]::OrdinalIgnoreCase)) {
              continue
            }
            gh release view $tag --json tagName *> $null
            if ($LASTEXITCODE -eq 0) {
              $existingTag = $tag
              break
            }
          }
          if ([string]::IsNullOrWhiteSpace($existingTag)) {
            "skip=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Release $existingTag already targets $env:RELEASE_SHA; skipping duplicate publication."
            "skip=true" >> $env:GITHUB_OUTPUT
            "existing_tag=$existingTag" >> $env:GITHUB_OUTPUT
          }

      - name: Determine next patch version
        if: steps.release_guard.outputs.skip != 'true'
        id: version
        shell: pwsh
        run: |
          $tags = @(
            git tag --list | ForEach-Object {
              $tag = [string]$_
              if ($tag -match '^v?(\d+)\.(\d+)\.(\d+)$') {
                [pscustomobject]@{
                  Name = $tag
                  Version = [version]::new(
                    [int]$Matches[1],
                    [int]$Matches[2],
                    [int]$Matches[3])
                }
              }
            } | Sort-Object -Property Version -Descending
          )
          if ($tags.Count -eq 0) {
            $next = "0.1.0"
            $previousTag = ""
          } else {
            $latest = $tags[0]
            $next = [version]::new(
              $latest.Version.Major,
              $latest.Version.Minor,
              $latest.Version.Build + 1).ToString(3)
            $previousTag = $latest.Name
          }
          "version=$next" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT

      - name: Set up Rust
        if: steps.release_guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed." }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw "Could not select the stable Rust toolchain." }

      - name: Check formatting
        if: steps.release_guard.outputs.skip != 'true'
        run: cargo fmt --check

      - name: Run tests
        if: steps.release_guard.outputs.skip != 'true'
        run: cargo test --locked

      - name: Run Clippy
        if: steps.release_guard.outputs.skip != 'true'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release executable
        if: steps.release_guard.outputs.skip != 'true'
        env:
          USAGE_TRAY_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --locked --release

      - name: Verify release executable
        if: steps.release_guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $asset = "target/release/usage-tray-rs.exe"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf) -or (Get-Item -LiteralPath $asset).Length -le 0) {
            throw "The Rust release executable is missing or empty: $asset"
          }

      - name: Generate release notes
        if: steps.release_guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $previousTag = "${{ steps.version.outputs.previous_tag }}"
          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            $commits = @(git log --pretty=format:"- %s (%h)" --max-count=50)
          } else {
            $commits = @(git log --pretty=format:"- %s (%h)" "$previousTag..HEAD")
          }
          if ($commits.Count -eq 0) {
            $commits = @("- No code changes since the previous release.")
          }
          $notes = @(
            "## Changes",
            ""
          ) + $commits + @(
            "",
            "## Download",
            "- ``usage-tray-rs.exe`` is the standalone Windows tray app.",
            "- Earlier C# installations need to download this executable separately; see the README for migration details."
          )
          Set-Content -Path "release_notes.md" -Value $notes -Encoding UTF8

      - name: Create GitHub release
        if: steps.release_guard.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch main before publication." }
          $mainSha = [string](git rev-parse origin/main)
          if (-not [string]::Equals($mainSha.Trim(), $env:GITHUB_SHA, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Release SHA $env:GITHUB_SHA is no longer the current main head $($mainSha.Trim())."
          }
          gh release create "${{ steps.version.outputs.version }}" `
            "target/release/usage-tray-rs.exe" `
            --title "${{ steps.version.outputs.version }}" `
            --notes-file "release_notes.md" `
            --target "${{ github.sha }}" `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed with exit code $LASTEXITCODE." }
